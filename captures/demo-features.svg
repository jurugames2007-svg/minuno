<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2410" />
      <stop offset="60%" stop-color="#1a0c04" />
    </linearGradient>
  </defs>
  <!-- Fondo -->
  <rect width="900" height="500" fill="url(#bgGrad)" />
  
  <!-- Título -->
  <text x="450" y="40" text-anchor="middle" fill="#ffd27a" font-family="sans-serif" font-size="28" font-weight="bold">MAXINE · PANADERÍA ENCANTADA V2</text>
  <text x="450" y="70" text-anchor="middle" fill="#ffe066" font-family="sans-serif" font-size="14">Estado: PERFECTO — Build funcionando (457kB)</text>
  
  <!-- Columna izquierda: Colisión y Torre -->
  <g transform="translate(60, 120)">
    <!-- Torre con bloques sólidos -->
    <rect x="0" y="0" width="45" height="45" fill="#e4d2ac" stroke="#a89068" stroke-width="2" />
    <rect x="55" y="0" width="45" height="45" fill="#b07a3c" stroke="#7a4a1c" stroke-width="2" />
    <rect x="0" y="55" width="45" height="45" fill="#b07a3c" stroke="#7a4a1c" stroke-width="2" />
    <rect x="55" y="55" width="45" height="45" fill="#6a2e14" stroke="#3a1608" stroke-width="2" />
    <!-- Plataforma (Tile 6) -->
    <rect x="0" y="110" width="100" height="35" fill="#d9a86a" stroke="#7a5428" stroke-width="2" rx="3" />
    <text x="50" y="132" text-anchor="middle" fill="#fff3d6" font-size="10" font-family="monospace">plataforma</text>
    <!-- Línea de caída -->
    <line x1="50" y1="145" x2="50" y2="230" stroke="#ff3060" stroke-width="2" stroke-dasharray="5 3" opacity="0.8" />
    <circle cx="50" cy="150" r="3" fill="#ff3060" />
    <!-- Etiqueta -->
    <text x="50" y="245" text-anchor="middle" fill="#ff3060" font-size="10" font-family="sans-serif">Indicador de caída</text>
  </g>
  
  <!-- Columna central: Jugador y Mecánicas -->
  <g transform="translate(260, 120)">
    <!-- Jugador (representación simplificada) -->
    <circle cx="50" cy="50" r="25" fill="#e8a64a" stroke="#7a4410" stroke-width="2" />
    <ellipse cx="35" cy="40" rx="6" ry="10" fill="#c9a888" stroke="#6a4a2a" stroke-width="1" />
    <ellipse cx="65" cy="40" rx="6" ry="10" fill="#c9a888" stroke="#6a4a2a" stroke-width="1" />
    <circle cx="50" cy="55" r="8" fill="#fff3d6" stroke="#7a4410" stroke-width="1" />
    <!-- Flechas de salto -->
    <line x1="50" y1="25" x2="50" y2="-15" stroke="#fff3d6" stroke-width="3" marker-end="url(#arrow)" opacity="0.9" />
    <line x1="70" y1="50" x2="100" y2="30" stroke="#fff3d6" stroke-width="2" opacity="0.8" />
    <text x="50" y="-25" text-anchor="middle" fill="#fff3d6" font-size="10" font-family="sans-serif">Doble Salto</text>
    <text x="110" y="25" text-anchor="start" fill="#fff3d6" font-size="10" font-family="sans-serif">Wall Climb</text>
    <!-- Partículas harina -->
    <circle cx="90" cy="80" r="2" fill="#fff7e0" opacity="0.9" />
    <circle cx="100" cy="70" r="2.5" fill="#fff7e0" opacity="0.8" />
    <circle cx="80" cy="90" r="1.5" fill="#fff7e0" opacity="0.7" />
    <text x="100" y="110" text-anchor="start" fill="#fff7e0" font-size="9" font-family="sans-serif">Feedback visual</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#fff3d6" />
    </marker>
  </defs>
  
  <!-- Columna derecha: HUD y UI -->
  <g transform="translate(520, 120)">
    <!-- Barra de salud -->
    <rect x="0" y="0" width="120" height="16" rx="8" fill="#1a0c04" stroke="#7a3410" stroke-width="1" />
    <rect x="4" y="4" width="70" height="8" rx="4" fill="#ff4d6d" />
    <text x="80" y="13" fill="#fff3d6" font-size="10" font-family="sans-serif">Salud visible</text>
    
    <!-- Nivel y zona -->
    <rect x="0" y="30" width="120" height="14" rx="7" fill="#3a2010" />
    <text x="60" y="41" text-anchor="middle" fill="#ffd27a" font-size="9" font-family="monospace">NIVEL 1 · Mesa</text>
    
    <!-- Poderes activos -->
    <rect x="0" y="60" width="50" height="20" rx="10" fill="#5a3216" stroke="#ffd27a" stroke-width="1" />
    <text x="25" y="73" text-anchor="middle" fill="#ffd27a" font-size="8" font-family="sans-serif">🚀 Boost</text>
    <rect x="55" y="60" width="50" height="20" rx="10" fill="#5a3216" stroke="#ffd27a" stroke-width="1" />
    <text x="80" y="73" text-anchor="middle" fill="#ffd27a" font-size="8" font-family="sans-serif">🍞 35</text>
    
    <!-- Texto descriptivo -->
    <text x="60" y="110" text-anchor="middle" fill="#ffe066" font-size="10" font-family="sans-serif">UI clara y siempre visible</text>
    <text x="60" y="125" text-anchor="middle" fill="#ffe066" font-size="10" font-family="sans-serif">Indicadores de plataforma</text>
  </g>
  
  <!-- Pie -->
  <rect x="0" y="460" width="900" height="40" fill="#1a0c04" stroke="#3a2010" stroke-width="2" />
  <text x="450" y="485" text-anchor="middle" fill="#ffd27a" font-size="12" font-family="sans-serif">Todas las features probadas y funcionando — Rama: arena/01a014e6-minuno</text>
</svg>
